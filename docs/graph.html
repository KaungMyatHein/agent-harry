<style>
  :root{ --bg:#0a0c10; --ink:#e8ecf2; --muted:#8a93a3; --panel:#11141b; --line:#20242e; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'SF Pro Display','SF Pro Text',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .top{position:fixed;top:22px;left:24px;z-index:5;pointer-events:none}
  .top h1{font-size:21px;font-weight:600;letter-spacing:-.3px}
  .top p{font-size:13px;color:var(--muted);margin-top:3px;letter-spacing:.2px}
  .lang{position:fixed;top:22px;right:24px;z-index:6;display:flex;background:#161a22;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px/1 inherit;padding:9px 16px;cursor:pointer;letter-spacing:.04em}
  .lang button.on{background:#2a2f3b;color:#fff}
  .legend{position:fixed;left:24px;bottom:20px;z-index:5;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .hint{position:fixed;right:24px;bottom:20px;z-index:5;font-size:12px;color:var(--muted)}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
    z-index:8;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.7)}
  #panel.open{transform:none}
  .ph{padding:26px 28px 18px;border-bottom:1px solid var(--line);position:relative}
  .ph .close{position:absolute;top:20px;right:22px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .ph .mascot{width:78px;height:78px;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));border-radius:16px;padding:8px}
  .ph .nm{font-size:25px;font-weight:600;letter-spacing:-.6px;margin-top:14px;word-break:break-word}
  .ph .meta{display:flex;gap:8px;margin-top:12px}
  .ph .pill{font:600 12px/1 inherit;letter-spacing:.08em;padding:7px 13px;border-radius:999px}
  .ph .mc{font:600 12px/1 inherit;color:var(--muted);background:#1b1f29;padding:7px 13px;border-radius:999px}
  .body{padding:22px 28px 40px;overflow:auto;flex:1;font-size:15px;line-height:1.55}
  .body h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 7px}
  .body p{margin:0 0 9px;color:#d3d9e2}
  .body p.lead{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.3px;line-height:1.32;margin-bottom:16px}
  .body li{list-style:none;padding-left:18px;position:relative;margin:5px 0;color:#d3d9e2}
  .body li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.65}
  .body p.cta{margin-top:16px;font-weight:600;color:#fff}
  .body p.tags{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.02em}
  .body pre{background:#0c0f15;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:500 13px/1.5 ui-monospace,Menlo,monospace;color:#cdd5e1;white-space:pre-wrap;margin:6px 0 10px}
  .body b{color:#fff}
  .pending{font-size:13px;color:var(--muted);background:#1b1f29;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
</style>
</head>

<script>
const DATA = {"phases":{"meta":{"color":"#7c79f0","c2":"#a78bfa","label":"Meta"},"discovery":{"color":"#2a93ff","c2":"#38b6ff","label":"Discovery","sub":"Understand the problem"},"define":{"color":"#9a5cf0","c2":"#b15cff","label":"Define","sub":"Decide what to build"},"deliver":{"color":"#16b69b","c2":"#1cb89a","label":"Deliver","sub":"Make it real"},"cross-cutting":{"color":"#e3568c","c2":"#f0568c","label":"Cross-cutting","sub":"Run any time"}},"nodes":[{"id":"orchestrator","kind":"agent","phase":"meta","model":"opus","name":"orchestrator","tagline":"Decomposes the goal, sequences the agents, enforces the gates.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#ffd54f\"><rect x=\"7\" y=\"0\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"1\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#0066cc\"><rect x=\"7\" y=\"2\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"3\" width=\"3\" height=\"1\"/><rect x=\"5\" y=\"4\" width=\"5\" height=\"1\"/></g>\n  <rect x=\"4\" y=\"5\" width=\"7\" height=\"1\" fill=\"#003a7a\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#0066cc\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#ffd54f\"><rect x=\"5\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"12\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"You don't have a design problem. You have a sequencing problem — and it's why your sprint keeps stalling. 🧭\n\n✦ What it is\nThe orchestrator is the planning and routing brain of Agent Harry. You hand it a messy, multi-phase goal and it breaks it down, picks the right sub-agents, sequences them, and drops in approval gates. It plans and delegates — it never does the design work itself.\n\n✦ When to use it\nWhen you're staring at a multi-phase task and don't know the right order. Or when you have a deadline (\"ship X by Y\") and need a realistic, gated path to get there.\n\n✦ Why use it\nWithout it, your sub-agents fire blindly and return a pile of disconnected docs. The orchestrator runs an Alignment Loop — diagnose, smallest next move, realign — so the plan stays honest as reality shifts.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the orchestrator agent to plan a discovery-to-deliver cycle for our new onboarding flow, shipping in three weeks.\"\n\n✦ Benefits\n- One sequenced plan with the right agents in the right order\n- Enforced Research-First and Success-Metrics gates\n- Synthesized outputs — one next move, not a document dump\n\n👉 That's the orchestrator agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Orchestration #DesignOps #ProductStrategy\n","my":"မင်း ဒီမှာ ဒီဇိုင်း ပြဿနာ မဟုတ်ဘူး။ မင်းက အစီအစဉ် ပြဿနာ ရှိနေတာ — ဒါကြောင့် မင်းရဲ့ စပရင့်က တန်းလန်းကြီး ဖြစ်နေတာ။ 🧭\n\n✦ ဒါက ဘာလဲ\nOrchestrator က Agent Harry ရဲ့ စီစဉ်ရေးနဲ့ လမ်းညွှန်ပေးတဲ့ ဦးနှောက်လိုပဲ။ မင်းက ရှုပ်ထွေးပြီး အဆင့်အများကြီးပါတဲ့ ပန်းတိုင်တစ်ခုကို သူ့ဆီ ပေးလိုက်ရင် သူက အဲ့ဒါကို အပိုင်းပိုင်းခွဲမယ်၊ မှန်ကန်တဲ့ sub-agent တွေကို ရွေးမယ်၊ သူတို့ကို အစီအစဉ်တကျ ဆက်သွယ်ပေးမယ်၊ ပြီးတော့ approval gates တွေကို ထည့်ပေးမယ်။ သူက စီစဉ်ပေးပြီး အလုပ်ခွဲပေးတာ — သူကိုယ်တိုင် ဒီဇိုင်း အလုပ်ကို မလုပ်ဘူး။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nအဆင့်အများကြီးပါတဲ့ အလုပ်တစ်ခုကို ကြည့်နေပြီး ဘယ်အစီအစဉ်က မှန်မှန်း မသိတဲ့အခါမျိုး။ ဒါမှမဟုတ် deadline ရှိနေရင် (\"X ကို Y ထဲမှာ ship ဖို့\") ပေါ့၊ အဲ့ဒီကို ရောက်ဖို့အတွက် လက်တွေ့ကျကျ၊ တားဆီးနိုင်တဲ့ လမ်းကြောင်းတစ်ခု လိုအပ်တဲ့အခါ သုံးပေါ့။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမပါရင် မင်းရဲ့ sub-agent တွေက ဘာမှန်းညာမှန်း မသိဘဲ အလုပ်လုပ်ပြီး ဆက်စပ်မှုမရှိတဲ့ စာရွက်စာတမ်းတွေ ပုံကြီးချဲ့ ထုတ်လာမှာပဲ။ Orchestrator က Alignment Loop တစ်ခုကို လုပ်ဆောင်ပေးတယ် — ပြဿနာကို စစ်ဆေးမယ်၊ အငယ်ဆုံး နောက်တစ်ဆင့်ကို လုပ်မယ်၊ ပြန်လည် ချိန်ညှိမယ် — အဲ့ဒါကြောင့် အ reality ပြောင်းလဲလာရင်တောင် အစီအစဉ်က မှန်ကန်နေမှာပေါ့။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"Orchestrator agent ကို သုံးပြီး ငါတို့ရဲ့ onboarding flow အသစ်အတွက် discovery ကနေ deliver အထိ cycle တစ်ခုကို စီစဉ်ပေးပါ၊ သုံးပတ်အတွင်း ship ဖို့ပေါ့။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- မှန်ကန်တဲ့ agent တွေကို မှန်ကန်တဲ့ အစီအစဉ်အတိုင်း တန်းစီထားတဲ့ plan တစ်ခုရမယ်။\n- Research-First နဲ့ Success-Metrics gates တွေကို အတင်းအကြပ် အကောင်အထည်ဖော်ပေးတယ်။\n- ရလာတဲ့ output တွေကို စုစည်းပေးတယ် — စာရွက်စာတမ်းပုံကြီး မဟုတ်ဘူး၊ နောက်တစ်ဆင့် လုပ်ဖို့ အချက်ပဲ။\n\n👉 ဒါတွေက Agent Harry ထဲက orchestrator agent ပဲ။ တပ်ဆင်ပြီး အလုပ်လုပ်ခိုင်းလိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Orchestration #DesignOps #ProductStrategy\n","ax":0,"ay":-0.05},{"id":"discovery-researcher","kind":"agent","phase":"discovery","model":"sonnet","name":"discovery-researcher","tagline":"Turns raw data and interviews into framed problems.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#3d5a7f\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"2\"/><rect x=\"3\" y=\"5\" width=\"9\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#5e81ac\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"11\" width=\"1\" height=\"3\" fill=\"#3d5a7f\"/>\n</svg>\n","en":"You have a Notion full of interviews and a survey nobody read. None of it has become an insight yet. 🔍\n\n✦ What it is\nThe discovery-researcher is the agent that refuses to skip ahead to solutions. It turns raw research — interviews, surveys, analytics, secondary sources, old artifacts — into a clearly framed problem you can actually build against.\n\n✦ When to use it\nWhen you're starting a new feature and want the real problem before anyone sketches. Or when stakeholders disagree about what the problem even is.\n\n✦ Why use it\nWithout it, a vague \"users are unhappy\" never becomes a sharp, testable statement of who hurts, when, and why — and the loudest opinion wins instead of the evidence. It runs JTBD discovery to surface the job people are really hiring your product to do.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the discovery-researcher agent to synthesize my user interviews and frame the core problem.\"\n\n✦ Benefits\n- A dozen interviews become a handful of clear themes\n- A framed, testable problem statement plus JTBD insights\n- An evidence trail that powers the Research-First Gate\n\n👉 That's the discovery-researcher agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #UserResearch #JTBD #ProblemFraming\n","my":"မင်း Notion ထဲမှာ အင်တာဗျူးတွေနဲ့ ဘယ်သူမှ မဖတ်ဖူးတဲ့ စစ်တမ်းတွေ ရှိနေတယ်၊ ဒါပေမယ့် အဲဒါတွေထဲက ဘာအနှစ်သာရမှ မထွက်သေးဘူးလား။ 🔍\n\n✦ ဒါက ဘာလဲ\ndiscovery-researcher ဆိုတာ ဖြေရှင်းချက်ကို အမြန်သွားတာကို လက်မခံတဲ့ agent ပဲ။ ဒါက မင်းရဲ့ raw research တွေကို — အင်တာဗျူးတွေ၊ စစ်တမ်းတွေ၊ analytics တွေ၊ နောက်ခံအချက်အလက်တွေ၊ ဟောင်းနွမ်းနေတဲ့ အထောက်အထားတွေ — မင်း တကယ်တည်ဆောက်နိုင်မယ့် ပြဿနာတစ်ခုအဖြစ် ရှင်းရှင်းလင်းလင်း ပုံဖော်ပေးလိမ့်မယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nမင်း အသစ်တစ်ခု စမယ်ဆိုရင်၊ ဘယ်သူမှ ပုံမဆွဲခင် တကယ့်ပြဿနာကို သိချင်တဲ့အခါ။ ဒါမှမဟုတ်ဆိုရင်လည်း၊ ဘယ်သူတွေက ဘာပြဿနာလဲဆိုတာကို သဘောမတူကြတဲ့အခါ သုံးလို့ရတယ်။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမပါဘူးဆိုရင် \"user တွေ မပျော်ဘူး\" ဆိုတဲ့ စကားက \"ဘယ်သူက၊ ဘယ်အချိန်၊ ဘာကြောင့် ခံစားနေရတာလဲ\" ဆိုတဲ့ ထိလွယ်ရှလွယ် စကားတစ်ခွန်းမဖြစ်လာဘူး။ အဲဒီအခါ အထောက်အထားအစား အကျယ်ဆုံးအသံက အနိုင်ရသွားမှာပေါ့။ ဒါက user တွေ တကယ် ဘာအလုပ်အတွက် မင်းရဲ့ product ကို ငှားနေတာလဲဆိုတာကို ဖော်ထုတ်ဖို့ JTBD discovery ကို run ပေးလိမ့်မယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"discovery-researcher agent ကို သုံးပြီး ငါ့ user interviews တွေကို synthesize လုပ်ပေးပြီးတော့ core problem ကို frame လုပ်ပေးပါ။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- အင်တာဗျူး အတော်များများက ရှင်းလင်းတဲ့ အကြောင်းအရာ အနည်းငယ်အဖြစ် ပြောင်းသွားမယ်။\n- frame လုပ်ထားပြီး၊ test လုပ်နိုင်တဲ့ problem statement နဲ့ JTBD insights တွေ ရမယ်။\n- Research-First Gate ကို အားဖြည့်ပေးမယ့် evidence trail တစ်ခု ရမယ်။\n\n👉 ဒါက Agent Harry ထဲက discovery-researcher agent ပဲ။ install လုပ်ပြီး run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #UserResearch #JTBD #ProblemFraming\n","ax":-1.05,"ay":-0.18},{"id":"competitive-analyst","kind":"agent","phase":"discovery","model":"sonnet","name":"competitive-analyst","tagline":"Teardowns, pattern audits, and feature-gap maps.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#1a574c\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"5\" width=\"5\" height=\"1\"/></g>\n  <rect x=\"11\" y=\"3\" width=\"1\" height=\"1\" fill=\"#1a574c\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"6\" y=\"9\" width=\"3\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"8\" width=\"2\" height=\"2\"/><rect x=\"9\" y=\"8\" width=\"2\" height=\"2\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#67e8f9\"><rect x=\"4\" y=\"9\" width=\"1\" height=\"1\"/><rect x=\"10\" y=\"9\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#2c7d6f\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"Your three biggest competitors all share the same blind spot. Have you found it yet? ⚔️\n\n✦ What it is\nThe competitive-analyst studies how everyone else solved the problem before you commit to your own answer. Part skeptic, part archaeologist — it teardowns competitors, audits UI patterns, and maps where the gaps and opportunities really are.\n\n✦ When to use it\nWhen you're entering a new product area and need the lay of the land fast. Or when you need to defend a design decision against \"but X does it this way\" with real evidence.\n\n✦ Why use it\nWithout it, you copy conventions nobody questioned and miss the white space worth owning. It separates the patterns users genuinely expect from the habits everyone just inherited.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the competitive-analyst agent to teardown our top three rivals and find the feature gaps.\"\n\n✦ Benefits\n- Competitor teardowns and a category-wide UI pattern audit\n- A feature gap map that surfaces the white space\n- Category positioning showing where you can stand apart\n\n👉 That's the competitive-analyst agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #CompetitiveAnalysis #ProductStrategy #UXResearch\n","my":"မင်းရဲ့ ပြိုင်ဘက် ၃ ယောက်လုံးမှာ မသိတဲ့ အားနည်းချက် တစ်ခုတည်း ရှိတယ်၊ မင်းတွေ့ပြီလား? ⚔️\n\n✦ ဒါက ဘာလဲ\ncompetitive-analyst က ဘယ်သူမှ မဖြေရှင်းရသေးတဲ့ ပြဿနာကို မင်း ကိုယ်တိုင် မဖြေရှင်းခင် အရင်ဆုံး ဘယ်သူတွေ ဘယ်လို ဖြေရှင်းခဲ့လဲ ဆိုတာကို လေ့လာပေးတာ။ သံသယသမားလို၊ ရှေးဟောင်းသုတေသီလိုပဲ — ပြိုင်ဘက်တွေကို ခွဲခြမ်းစိတ်ဖြာတယ်၊ UI ပုံစံတွေကို စစ်ဆေးတယ်၊ ဘယ်မှာ အကွာအဟနဲ့ အခွင့်အလမ်းတွေ ရှိလဲ ဆိုတာကို ပုံဖော်ပေးတယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nမင်း အသစ်ဝင်လာတဲ့ ထုတ်ကုန်နယ်ပယ်မှာ ရှိပြီး အခြေအနေကို မြန်မြန် သိချင်တဲ့အခါ။ ဒါမှမဟုတ် \"ဒါပေမယ့် X က ဒီလို လုပ်တာပဲ\" ဆိုတဲ့ ဒီဇိုင်းဆုံးဖြတ်ချက်ကို တကယ့်အထောက်အထားတွေနဲ့ ကာကွယ်ဖို့ လိုတဲ့အခါ သုံးရတယ်။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမပါရင်၊ ဘယ်သူမှ မမေးမြန်းခဲ့တဲ့ အစဉ်အလာတွေကို ကူးယူမိပြီး ပိုင်ဆိုင်ထိုက်တဲ့ နေရာလွတ်တွေကို လွဲချော်သွားလိမ့်မယ်။ သုံးစွဲသူတွေ တကယ့်ကို မျှော်လင့်ထားတဲ့ ပုံစံတွေနဲ့ အားလုံးက အမွေရထားတဲ့ အကျင့်တွေကို ခွဲခြားပေးတယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"competitive-analyst agent ကို သုံးပြီး ငါတို့ရဲ့ ထိပ်တန်း ပြိုင်ဘက် ၃ ယောက်ကို ခွဲခြမ်းစိတ်ဖြာပြီး feature gap တွေကို ရှာပေးပါ\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- ပြိုင်ဘက်တွေရဲ့ Teardown တွေနဲ့ ကဏ္ဍတစ်ခုလုံးရဲ့ UI ပုံစံ စစ်ဆေးမှု\n- အပြင်မှာ ဘယ်မှာ ကွဲပြားအောင် လုပ်လို့ရမလဲ ဆိုတာကို ပြသပေးတဲ့ Feature Gap Map\n- မင်း ဘယ်မှာ ထင်ပေါ်အောင် လုပ်နိုင်မလဲ ဆိုတာကို ပြသပေးတဲ့ ကဏ္ဍအလိုက် အနေအထား\n\n👉 ဒါက Agent Harry ထဲက competitive-analyst agent ပဲ။ တပ်ဆင်ပြီး အသုံးပြုပါ။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #CompetitiveAnalysis #ProductStrategy #UXResearch","ax":-1.05,"ay":-0.18},{"id":"pm-strategist","kind":"agent","phase":"define","model":"sonnet","name":"pm-strategist","tagline":"Vision, business model, pricing, north-star.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#0891b2\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/></g>\n  <rect x=\"3\" y=\"5\" width=\"9\" height=\"1\" fill=\"#035e7a\"/>\n  <rect x=\"7\" y=\"4\" width=\"1\" height=\"1\" fill=\"#ffd54f\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"7\" y=\"10\" width=\"2\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#0891b2\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#ffd54f\"><rect x=\"3\" y=\"11\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"11\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"\"What should we build next?\" is the wrong question. Here's the one that actually moves the business. ♟️\n\n✦ What it is\nThe pm-strategist is the agent for product work that lives above features — vision, business model, pricing, and the north-star metric. It's an opinionated strategist that names the bet instead of hiding behind a platitude.\n\n✦ When to use it\nWhen you're asking \"what game are we playing?\" instead of \"what should we build next?\". Or when you're entering a new market, repositioning, or facing a strategic inflection point.\n\n✦ Why use it\nWithout it, the read on the landscape stays a gut feeling. It runs structured SWOT, PESTLE, and Porter scans plus market sizing — so a big call is grounded in real numbers, not vibes.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the pm-strategist agent to define our north-star metric and run a SWOT/PESTLE scan of the market.\"\n\n✦ Benefits\n- A named strategic bet: vision, business model, value prop, pricing\n- A north-star metric everyone can row toward\n- Rigorous SWOT/PESTLE/Porter scans and market sizing\n\n👉 That's the pm-strategist agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #ProductStrategy #NorthStar #ProductManagement\n","my":"","ax":0,"ay":-0.95},{"id":"product-positioner","kind":"agent","phase":"define","model":"sonnet","name":"product-positioner","tagline":"Sharpens what it IS and ISN'T.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#5c3a1a\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/></g>\n  <rect x=\"4\" y=\"5\" width=\"7\" height=\"1\" fill=\"#b91c1c\"/>\n  <rect x=\"6\" y=\"5\" width=\"3\" height=\"1\" fill=\"#dc2626\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#d97706\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#7a4e1f\"><rect x=\"5\" y=\"11\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"7\" y=\"13\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"Five stakeholders, five different answers to \"what is this product?\" That's not alignment — that's a launch about to wobble. 🎯\n\n✦ What it is\nThe product-positioner sharpens what a product, feature, or release IS and ISN'T. It picks a side: clear positioning statements, value props, a differentiation narrative, and naming — instead of mushy \"all things to all people\" messaging.\n\n✦ When to use it\nWhen stakeholders are pulled in different directions about scope or message. Or when you need to define not just what a release IS, but what it deliberately ISN'T.\n\n✦ Why use it\nThe fastest way to make a product forgettable is to make it for everyone. Without sharp positioning, the market remembers you for nothing in particular instead of something specific.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the product-positioner agent to write a positioning statement and sharpen what this release is and isn't.\"\n\n✦ Benefits\n- Crisp positioning statements and value props that make people care\n- A differentiation narrative the market actually remembers\n- Naming options that carry real meaning\n\n👉 That's the product-positioner agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Positioning #ValueProposition #ProductMarketing\n","my":"","ax":0,"ay":-0.95},{"id":"feature-prioritizer","kind":"agent","phase":"define","model":"sonnet","name":"feature-prioritizer","tagline":"What to build, in what order, and what to cut.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#b45309\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/></g>\n  <rect x=\"3\" y=\"5\" width=\"9\" height=\"1\" fill=\"#7a3905\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"7\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#b45309\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"Everything's a P0. Which means nothing is — and your team is drowning in a backlog nobody trusts. 📊\n\n✦ What it is\nThe feature-prioritizer is the agent that refuses to call everything a P0. Hand it a list of features, ideas, or scope items and it decides what to build, in what order, and what to cut — using RICE, ICE, and Kano scoring.\n\n✦ When to use it\nWhen you have a pile of features and need to decide order, scope, or cuts. Or when you're in a scope argument with stakeholders and need a defensible, scored answer.\n\n✦ Why use it\nWithout it, \"minimal\" quietly smuggles everything across the line and the MVP isn't minimal at all. It draws a real must-have vs nice-to-have line and gives you the reasoning to back every cut when someone pushes.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the feature-prioritizer agent to score this backlog with RICE and draw the MVP cut line.\"\n\n✦ Benefits\n- RICE/ICE/Kano scores and a ranked list\n- A real MVP cut line, not everything-in disguise\n- A defensible reason behind every win, wait, and drop\n\n👉 That's the feature-prioritizer agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Prioritization #RICE #MVP\n","my":"ဘာမဆို P0 ပဲ။ အဲ့ဒါဆို ဘာမှ P0 မဟုတ်တော့ဘူးလေ — မင်းတို့အဖွဲ့က ဘယ်သူမှ မယုံတဲ့ Backlog ကြီးထဲ နစ်မြုပ်နေပြီပေါ့။ 📊\n\n✦ ဒါက ဘာလဲ\nFeature-prioritizer ဆိုတာက အရာအားလုံးကို P0 လို့ မခေါ်ဘူးလို့ ငြင်းတဲ့ agent ပဲ။ Features တွေ၊ Idea တွေ၊ Scope Item တွေ စာရင်းပေးလိုက်၊ ဘာကို တည်ဆောက်မလဲ၊ ဘယ်အစီအစဉ်အတိုင်းလဲ၊ ဘာကို ဖြတ်မယ်ဆိုတာကို RICE, ICE, နဲ့ Kano scoring သုံးပြီး သူပဲ ဆုံးဖြတ်ပေးလိမ့်မယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nFeature တွေ ပုံကြီးနဲ့ ရှိနေပြီး အစီအစဉ်၊ Scope ဒါမှမဟုတ် ဖြတ်တောက်မှုတွေ ဆုံးဖြတ်ဖို့ လိုအပ်တဲ့အခါ သုံး။ ဒါမှမဟုတ် Stakeholder တွေနဲ့ Scope အငြင်းပွားနေပြီး အထောက်အထားခိုင်လုံတဲ့၊ Score နဲ့တကွ အဖြေလိုတဲ့အခါ သုံး။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင် \"Minimal\" ဆိုတာ ဘာမှ မပါတဲ့အရာတွေ အကုန်လုံးကို တိတ်တဆိတ် ကူးခတ်သွားစေပြီး MVP က Minimal မဖြစ်တော့ဘူး။ တကယ့်ကို မဖြစ်မနေလိုတာနဲ့ ရှိရင်ကောင်းတာ ဆိုတဲ့ လိုင်းကို ဆွဲပေးပြီး တစ်ယောက်ယောက်က ဖိရင် ဖြတ်တောက်မှုတိုင်းအတွက် အကြောင်းပြချက်ပေးနိုင်အောင် လုပ်ပေးတယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"feature-prioritizer agent ကို သုံးပြီး ဒီ backlog ကို RICE နဲ့ score ပေးပြီး MVP cut line ကို ဆွဲပေးပါ\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- RICE/ICE/Kano score တွေနဲ့ အဆင့်ခွဲထားတဲ့စာရင်း\n- တကယ့် MVP cut line (အကုန်လုံးကို ဖုံးကွယ်မထားဘူး)\n- အနိုင်ရတာ၊ စောင့်ဆိုင်းရတာ၊ ပယ်ချတာ အားလုံးနောက်ကွယ်က အထောက်အထားခိုင်လုံတဲ့ အကြောင်းပြချက်\n\n👉 ဒါက Agent Harry ထဲက feature-prioritizer agent ပဲ။ Install လုပ်ပြီး Run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Prioritization #RICE #MVP","ax":0,"ay":-0.95},{"id":"ideation-facilitator","kind":"agent","phase":"define","model":"sonnet","name":"ideation-facilitator","tagline":"Diverge before you converge.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#ffd54f\"><rect x=\"6\" y=\"0\" width=\"3\" height=\"1\"/><rect x=\"5\" y=\"1\" width=\"5\" height=\"1\"/><rect x=\"6\" y=\"2\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"6\" y=\"3\" width=\"3\" height=\"1\" fill=\"#9ca3af\"/>\n  <g fill=\"#ffd54f\"><rect x=\"3\" y=\"1\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"1\" width=\"1\" height=\"1\"/><rect x=\"2\" y=\"3\" width=\"1\" height=\"1\"/><rect x=\"13\" y=\"3\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#8b5cf6\"><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"2\" height=\"1\"/><rect x=\"10\" y=\"4\" width=\"2\" height=\"1\"/><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#8b5cf6\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"You jumped straight to wireframes and shipped the first idea you had. The good one never got a chance. 💡\n\n✦ What it is\nThe ideation-facilitator opens up the funnel before you narrow it down. It runs divergent ideation — reframing the problem, generating lots of concepts fast, and pushing you past the obvious first answer.\n\n✦ When to use it\nWhen the problem is framed and understood, but you haven't explored solutions yet. Or when you keep defaulting to the first idea and want real alternatives on the table.\n\n✦ Why use it\nWithout it, the concept you ship is an accident, not a choice. It runs \"How Might We\" reframes and rapid crazy-8s-style generation with no early judgment — so the weird, possibly-best ideas survive long enough to be considered.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the ideation-facilitator agent to generate concept directions for our new onboarding flow before we wireframe.\"\n\n✦ Benefits\n- \"How Might We\" reframes that crack open a stuck problem\n- A spread of distinct concept directions to react to\n- Sketch prompts that let you feel the space before committing\n\n👉 That's the ideation-facilitator agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Ideation #DesignThinking #HowMightWe\n","my":"","ax":0,"ay":-0.95},{"id":"prd-author","kind":"agent","phase":"define","model":"sonnet","name":"prd-author","tagline":"One PRD per shipped sub-feature.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#92400e\"><rect x=\"11\" y=\"3\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"4\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"11\" y=\"5\" width=\"1\" height=\"4\" fill=\"#f3e8c4\"/>\n  <rect x=\"11\" y=\"9\" width=\"1\" height=\"1\" fill=\"#1e3a8a\"/>\n  <g fill=\"#3f3520\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"10\" y=\"5\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"5\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"6\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#1e3a8a\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#f3e8c4\"><rect x=\"5\" y=\"12\" width=\"5\" height=\"1\"/><rect x=\"5\" y=\"13\" width=\"5\" height=\"1\"/></g>\n  <g fill=\"#1e3a8a\"><rect x=\"6\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"8\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"13\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"Your prioritized backlog is a list of titles. Nobody can build a title. 📝\n\n✦ What it is\nThe prd-author turns your prioritized backlog into real PRDs — one per feature you tagged \"in.\" It writes each spec to your project workspace and hands back a manifest table you confirm before any Deliver work starts.\n\n✦ When to use it\nWhen the Success-Metrics Gate has cleared and you have a prioritized backlog. Or when you want one PRD per \"in\"-tagged sub-feature, written consistently rather than by hand.\n\n✦ Why use it\nWithout it, a \"yes\" stays a title nobody can build against. It's JTBD-driven and ruthless about scope — every PRD says what's in and, just as importantly, what's deliberately left out.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the prd-author agent to generate one PRD per in-tagged feature from our prioritized backlog.\"\n\n✦ Benefits\n- One focused, JTBD-anchored PRD per \"in\"-tagged feature\n- Specs written into your project workspace, versioned alongside everything\n- A single manifest table to review and approve before Deliver begins\n\n👉 That's the prd-author agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #PRD #ProductRequirements #JTBD\n","my":"","ax":0,"ay":-0.95},{"id":"information-architect","kind":"agent","phase":"define","model":"sonnet","name":"information-architect","tagline":"Maps the product's bones before anyone sketches.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <!-- hard hat -->\n  <g fill=\"#fbbf24\"><rect x=\"7\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"5\" y=\"3\" width=\"6\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"8\" height=\"1\"/></g>\n  <rect x=\"3\" y=\"5\" width=\"10\" height=\"1\" fill=\"#d97706\"/>\n  <!-- face skin -->\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <!-- eyes + smile + boots -->\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <!-- body (indigo) -->\n  <g fill=\"#4338ca\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <!-- blueprint grid on chest -->\n  <g fill=\"#a5b4fc\"><rect x=\"5\" y=\"12\" width=\"5\" height=\"1\"/><rect x=\"5\" y=\"13\" width=\"5\" height=\"1\"/></g>\n  <g fill=\"#4338ca\"><rect x=\"6\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"8\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"7\" y=\"13\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"Every screen looks fine on its own, and the whole product still feels like a mess. That gap is the bones. 🦴\n\n✦ What it is\nThe information-architect maps the whole product's structure before anyone designs a screen. It builds the object model, navigation hierarchy, screen inventory, and a product-wide action-priority system across all features in a release.\n\n✦ When to use it\nWhen PRDs exist for a release and you need cross-feature structure before per-screen layout. Or when the product feels disjointed even though individual screens look okay.\n\n✦ Why use it\nThe lo-fi-designer designs one feature at a time, and nobody else owns how all the features fit together. That missing owner is exactly why a product feels \"messy\" even when each screen is fine — this agent is that owner.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the information-architect agent to map the object model, navigation, and screen inventory for this release before we start wireframing.\"\n\n✦ Benefits\n- One shared object model and navigation hierarchy\n- A full screen inventory seen all at once\n- A product-wide action-priority system, consistent across every feature\n\n👉 That's the information-architect agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #InformationArchitecture #NavigationDesign #IA\n","my":"တစ်ခုချင်းစီ ကြည့်ရင် ကောင်းနေတာပဲ၊ ဒါပေမဲ့ ပရောဂျက်တစ်ခုလုံးကတော့ ရှုပ်ပွေနေတုန်းပဲ။ အဲ့ဒီကြားထဲက ဟနေတဲ့ နေရာက အဓိကကျတဲ့ အချက်ပဲ။ 🦴\n\n✦ ဒါက ဘာလဲ\nဒီ information-architect က ဘယ်သူမှ စခရင်ဒီဇိုင်းမဆွဲခင် ပရောဂျက်တစ်ခုလုံးရဲ့ ဖွဲ့စည်းပုံကို ပုံဖော်ပေးတာ။ ဒါက release တစ်ခုထဲက အရာအားလုံးရဲ့ object model၊ navigation hierarchy၊ screen inventory နဲ့ product တစ်ခုလုံးအတွက် action-priority system ကို တည်ဆောက်ပေးတယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nRelease တစ်ခုအတွက် PRD တွေရှိပြီး၊ စခရင်တစ်ခုချင်းစီရဲ့ layout မစခင်မှာပဲ cross-feature structure လိုအပ်တဲ့အခါ။ ဒါမှမဟုတ် စခရင်တစ်ခုချင်းစီက ကောင်းနေပေမဲ့ ပရောဂျက်က တစ်ခုနဲ့တစ်ခု ဆက်စပ်မှုမရှိဘူးလို့ ခံစားရတဲ့အခါ သုံးပါ။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nlo-fi-designer က တစ်ချိန်မှာ တစ် feature ပဲ ဒီဇိုင်းလုပ်နိုင်တယ်လေ။ အဲ့ဒီတော့ feature အားလုံး ဘယ်လို အံဝင်ခွင်ကျဖြစ်မလဲဆိုတာကို ဘယ်သူမှ တာဝန်မယူတော့ဘူး။ ဒီလို ပိုင်ရှင်မရှိတာကြောင့်ပဲ စခရင်တစ်ခုချင်းစီ ကောင်းနေပေမဲ့ ပရောဂျက်က \"ရှုပ်ပွေနေသလို\" ခံစားရတာပေါ့။ ဒီ agent က အဲ့ဒီ ပိုင်ရှင်ပဲ။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"ဒီ release အတွက် wireframing မစခင် object model၊ navigation နဲ့ screen inventory ကို ပုံဖော်ပေးဖို့ information-architect agent ကို သုံးပါ။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- အားလုံး ပူးတွဲသုံးနိုင်တဲ့ object model နဲ့ navigation hierarchy တစ်ခု\n- တစ်ခါတည်း မြင်နိုင်တဲ့ screen inventory အပြည့်အစုံ\n- feature တိုင်းမှာ တသမတ်တည်းရှိတဲ့ product-wide action-priority system\n\n👉 ဒါက Agent Harry ထဲက information-architect agent ပဲ။ Install လုပ်ပြီး run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #InformationArchitecture #NavigationDesign #IA\n","ax":0,"ay":-0.95},{"id":"lo-fi-designer","kind":"agent","phase":"define","model":"sonnet","name":"lo-fi-designer","tagline":"Three layouts before falling in love with one.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <rect x=\"11\" y=\"5\" width=\"1\" height=\"3\" fill=\"#facc15\"/>\n  <rect x=\"11\" y=\"4\" width=\"1\" height=\"1\" fill=\"#525252\"/>\n  <rect x=\"11\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ef4444\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"10\" y=\"5\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"5\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"6\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#06b6d4\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"12\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <rect x=\"7\" y=\"12\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <rect x=\"9\" y=\"12\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <rect x=\"6\" y=\"13\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <rect x=\"8\" y=\"13\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n</svg>\n","en":"You fell in love with the first layout you drew. Now every critique feels like an attack. ✏️\n\n✦ What it is\nThe lo-fi-designer takes a chosen concept into layout. It maps the userflow, sketches ASCII wireframes with layout alternatives, and flags which Design System components apply and which new ones you need — all before any prototype code.\n\n✦ When to use it\nWhen you have a chosen concept and are moving from concept to layout. Or when you need layout alternatives and a mapped userflow before any code prototype.\n\n✦ Why use it\nIts whole voice is \"sketch three before falling in love with one,\" so the decision is deliberate instead of defended. It also makes the gap between \"what we can reuse\" and \"what we have to build\" visible before anyone prototypes.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the lo-fi-designer agent to wireframe three layout options for this feature and map them to our design system.\"\n\n✦ Benefits\n- Three real ASCII layout alternatives, not one favorite\n- A mapped userflow grounding the layout in how people move\n- A clear list of which DS components apply and which new ones are needed\n\n👉 That's the lo-fi-designer agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Wireframing #LoFi #DesignSystems\n","my":"","ax":0,"ay":-0.95},{"id":"figma-designer","kind":"agent","phase":"deliver","model":"sonnet","name":"figma-designer","tagline":"Lo-fi boxes become real Figma screens.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <rect x=\"11\" y=\"5\" width=\"1\" height=\"3\" fill=\"#a855f7\"/>\n  <rect x=\"11\" y=\"4\" width=\"1\" height=\"1\" fill=\"#c084fc\"/>\n  <rect x=\"11\" y=\"8\" width=\"1\" height=\"1\" fill=\"#581c87\"/>\n  <rect x=\"12\" y=\"3\" width=\"1\" height=\"1\" fill=\"#e9d5ff\"/>\n  <g fill=\"#a855f7\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"10\" y=\"5\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"2\" width=\"1\" height=\"1\" fill=\"#c084fc\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"5\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"6\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#a855f7\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"12\" width=\"2\" height=\"1\" fill=\"#c084fc\"/>\n  <rect x=\"8\" y=\"12\" width=\"2\" height=\"1\" fill=\"#c084fc\"/>\n  <rect x=\"5\" y=\"13\" width=\"2\" height=\"1\" fill=\"#e9d5ff\"/>\n  <rect x=\"8\" y=\"13\" width=\"2\" height=\"1\" fill=\"#e9d5ff\"/>\n</svg>\n","en":"Your lo-fi got approved, and now you're staring at a blank Figma file at 11pm, rebuilding boxes by hand. Stop. 🎨\n\n✦ What it is\nThe figma-designer turns an approved lo-fi layout into real hi-fi Figma frames. It reads the lo-fi handoff and the PRD, plugs in your Design System's actual components, fills in real content, applies your color and type tokens, and lays out the key states.\n\n✦ When to use it\nWhen a lo-fi layout has been approved and you want hi-fi Figma screens (not code) for the chosen flow. Or when you want every frame built from your real Design System, instance by instance.\n\n✦ Why use it\nWithout it, you redraw rectangles and fill them with lorem ipsum — a mockup of a mockup. It builds from real component instances, pulls copy from the PRD, and includes the states beyond the happy path, so screens look shippable.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the figma-designer agent to turn the approved lo-fi into hi-fi Figma frames using our Design System.\"\n\n✦ Benefits\n- Real DS component instances, not redrawn boxes\n- Real PRD content and token-driven color and type\n- Key states present, not just the happy path\n\n👉 That's the figma-designer agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #HiFiDesign #DesignSystems\n","my":"မင်းရဲ့ lo-fi ဒီဇိုင်းက အတည်ပြုပြီးသွားပြီ၊ အခု ည ၁၁ နာရီမှာ ဗလာ Figma ဖိုင်ကြီးကို ကြည့်ရင်း လက်နဲ့ပဲ အကွက်တွေ ပြန်ဆွဲနေရပြီပေါ့။ ရပ်လိုက်တော့။ 🎨\n\n✦ ဒါက ဘာလဲ\nfigma-designer က အတည်ပြုပြီးသား lo-fi layout ကို တကယ့် hi-fi Figma frames တွေအဖြစ် ပြောင်းပေးတယ်။ သူက lo-fi handoff နဲ့ PRD ကို ဖတ်ပြီးတော့ မင်းရဲ့ Design System က တကယ့် component တွေကို ထည့်မယ်၊ တကယ့် content တွေနဲ့ ဖြည့်မယ်၊ မင်းရဲ့ color နဲ့ type token တွေကို သုံးမယ်၊ ပြီးတော့ key states တွေကိုလည်း စီစဉ်ပေးမယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nlo-fi layout က အတည်ပြုပြီးသွားပြီ၊ အဲ့ဒါကို hi-fi Figma screens တွေ (code မဟုတ်ဘူးနော်) နဲ့ မင်းရွေးချယ်ထားတဲ့ flow အတွက် လုပ်ချင်တဲ့အခါ။ ဒါမှမဟုတ် တကယ့် Design System ကနေ instance စီ instance စီနဲ့ ဖန်တီးထားတဲ့ frames တွေ အကုန်လုံးကို လိုချင်တဲ့အခါပေါ့။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင် မင်းက လေးထောင့်ကွက်တွေကို ပြန်ဆွဲပြီး lorem ipsum နဲ့ ဖြည့်ရမှာပေါ့ — mockup ရဲ့ mockup ပေါ့။ ဒါက တကယ့် component instance တွေကနေ တည်ဆောက်တယ်၊ PRD ကနေ copy ကို ယူတယ်၊ ပြီးတော့ happy path ကို ကျော်လွန်တဲ့ states တွေပါ ပါဝင်တယ်၊ ဒါကြောင့် screens တွေက ပို့ဆောင်လို့ရတဲ့ အနေအထားနဲ့ တူနေမှာပေါ့။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"figma-designer agent ကို သုံးပြီး အတည်ပြုပြီးသား lo-fi ကို Design System ကို အသုံးပြုပြီး hi-fi Figma frames တွေအဖြစ် ပြောင်းခိုင်းလိုက်။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- ပြန်ဆွဲထားတဲ့ အကွက်တွေ မဟုတ်ဘူး၊ တကယ့် DS component instance တွေ\n- တကယ့် PRD content နဲ့ token-driven color နဲ့ type\n- Happy path ပဲ မဟုတ်ဘူး၊ key states တွေပါ ပါဝင်တယ်\n\n👉 ဒါက Agent Harry ထဲက figma-designer agent ပဲ။ ထည့်သွင်းပြီးတော့ run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #HiFiDesign #DesignSystems","ax":1.05,"ay":-0.18},{"id":"design-engineer","kind":"agent","phase":"deliver","model":"sonnet","name":"design-engineer","tagline":"A real prototype in your real stack.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#be185d\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"3\" y=\"6\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"6\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"7\" y=\"8\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#ec4899\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"13\" width=\"5\" height=\"1\" fill=\"#be185d\"/>\n  <rect x=\"6\" y=\"12\" width=\"1\" height=\"1\" fill=\"#facc15\"/>\n  <rect x=\"8\" y=\"12\" width=\"1\" height=\"1\" fill=\"#facc15\"/>\n</svg>\n","en":"A pretty mockup that can't be clicked has fooled every stakeholder you've ever had — then died in handoff. 🖱️\n\n✦ What it is\ndesign-engineer turns an approved lo-fi layout into a real, runnable frontend prototype written in your project's actual stack — not a throwaway mockup.\n\n✦ When to use it\nA lo-fi layout just got approved and you want a clickable prototype in your real stack, not a static image. Or you need to pressure-test every state before anyone commits to build.\n\n✦ Why use it\nWithout it, you only ever see the happy path. It wires all five states — empty, loading, populated, error, and edge — as toggle-able routes, filled with dummy data, so \"what does this look like while loading?\" is one click away instead of imagination.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the design-engineer agent to build a runnable prototype of the approved lo-fi in our stack, with all 5 states as routes.\"\n\n✦ Benefits\n- Real code in your real stack — the prototype behaves like the thing\n- All 5 states built and clickable, not just the happy path\n- Honest dummy data, so the team can interact before committing to build\n\n👉 That's the design-engineer agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Prototyping #FrontendDev #DesignToCode\n","my":"မင်းရဲ့လူတွေအားလုံးကို အထင်မှားအောင်လုပ်ခဲ့တဲ့ ကလစ်လို့မရတဲ့ ပုံလှလှလေးတွေ... နောက်ဆုံးမှာ အလုပ်မဖြစ်တော့ဘူး။ 🖱️\n\n✦ ဒါက ဘာလဲ\ndesign-engineer ဆိုတာက အတည်ပြုပြီးသား lo-fi layout ကို မင်းရဲ့ project မှာ တကယ်သုံးနေတဲ့ coding language နဲ့ တကယ်အလုပ်လုပ်နိုင်တဲ့ frontend prototype အဖြစ် ပြောင်းပေးတာ။ ပစ်ပယ်ရမယ့် mockup မဟုတ်ဘူးနော်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nlo-fi layout က အတည်ပြုပြီးပြီ၊ မင်းက static image မဟုတ်ဘဲ တကယ် run လို့ရတဲ့ prototype လိုချင်တယ်ဆိုရင်ပေါ့။ ဒါမှမဟုတ် မင်း build ဖို့ commit မလုပ်ခင် အခြေအနေအားလုံးကို pressure test ချင်တယ်ဆိုရင်လည်း သုံးလို့ရတယ်။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင် မင်းက \"happy path\" ပဲ မြင်ရမှာ။ ဒါက state ငါးခုလုံးကို — empty, loading, populated, error, နဲ့ edge — toggle လုပ်လို့ရတဲ့ routes အနေနဲ့ တည်ဆောက်ပေးတယ်၊ dummy data တွေနဲ့ ပြည့်နေတာပေါ့။ ဒါကြောင့် \"loading တုန်းက ဘယ်လိုပုံစံလဲ?\" ဆိုတာကို စိတ်ကူးနဲ့ မဟုတ်ဘဲ တစ်ချက်နှိပ်ရုံနဲ့ မြင်နိုင်ပြီ။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"design-engineer agent ကို သုံးပြီး အတည်ပြုပြီးသား lo-fi ကို ငါတို့ stack မှာ run လို့ရတဲ့ prototype အဖြစ် build ပေး၊ အားလုံး 5 states ကို routes အနေနဲ့ ထည့်ပေး။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- မင်းရဲ့ real stack မှာ real code ရမယ် — prototype က တကယ် build လုပ်မယ့် အရာလိုပဲ အလုပ်လုပ်တယ်\n- state 5 ခုလုံးကို build ထားပြီး click လို့ရတယ်၊ happy path ပဲ မဟုတ်ဘူး\n- ကိုယ်ကျိုးမကြည့်တဲ့ dummy data နဲ့ဆိုတော့ commit မလုပ်ခင် team က interact လုပ်လို့ရတယ်\n\n👉 ဒါက Agent Harry ထဲက design-engineer agent ပဲ။ install လုပ်ပြီး run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Prototyping #FrontendDev #DesignToCode","ax":1.05,"ay":-0.18},{"id":"design-sync","kind":"agent","phase":"deliver","model":"sonnet","name":"design-sync","tagline":"Mirrors Figma to code 1:1. Invents nothing.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#1d4ed8\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"3\" y=\"6\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"6\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"7\" y=\"8\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#0c8c7a\"><rect x=\"3\" y=\"11\" width=\"4\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#2563eb\"><rect x=\"7\" y=\"11\" width=\"5\" height=\"1\"/><rect x=\"7\" y=\"12\" width=\"4\" height=\"1\"/><rect x=\"7\" y=\"13\" width=\"4\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#facc15\"><rect x=\"7\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"7\" y=\"13\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"Your \"design-to-code\" tool guessed a component you don't have — and now the diff is a lie you unpick by hand. 🪞\n\n✦ What it is\ndesign-sync mirrors an existing Figma file into code with 1:1 fidelity and zero hallucination, looking every node up in a component bridge and emitting only what's mapped.\n\n✦ When to use it\nYou want to mirror a Figma file into code exactly, not generate a new design. Or you need a divergence report showing where Figma and code have drifted apart.\n\n✦ Why use it\nWithout it, a generator papers over gaps with plausible components you don't actually have. design-sync invents nothing: mapped nodes become real components, unmapped ones become explicit GAP markers you decide on.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the design-sync agent to mirror this Figma frame into code 1:1 and flag anything unmapped as a GAP.\"\n\n✦ Benefits\n- 1:1 mirror with zero hallucination — it copies, it never guesses\n- Honest GAP markers for everything unmapped\n- A divergence report (--mode diff) between Figma and the code that should match it\n\n👉 That's the design-sync agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #DesignToCode #Playwright\n","my":"မင်းရဲ့ \"ဒီဇိုင်းကနေ ကုတ်ကို ပြောင်းတဲ့\" ကိရိယာက မင်းမရှိတဲ့ ကွန်ပိုနင့်တစ်ခုကို မှန်းဆမိသွားတယ် — အခု မင်းလက်နဲ့ ပြန်ပြင်ရမယ့် ကွာခြားချက်က လိမ်နေပြီ။ 🪞\n\n✦ ဒါက ဘာလဲ\ndesign-sync က Figma ဖိုင်တစ်ခုကို ကုတ်ထဲကို ပုံတူကူးပေးတယ်၊ အတိအကျ ၁:၁ ရာခိုင်နှုန်းနဲ့ မှန်းဆတာမျိုးလုံးဝမရှိဘူး။ ကွန်ပိုနင့်တံတားထဲမှာ ရှိတဲ့ node အတိုင်းရှာပြီး မှတ်ထားတာတွေကိုပဲ ထုတ်ပေးတယ်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nFigma ဖိုင်ကို ကုတ်ထဲကို အတိအကျ ပုံတူကူးချင်တဲ့အခါ၊ အသစ်ဒီဇိုင်းဆွဲတာမျိုးမဟုတ်ဘူး။ ဒါမှမဟုတ် Figma နဲ့ ကုတ် ဘယ်မှာ ကွာသွားပြီလဲဆိုတာ ပြတဲ့ ကွာခြားချက် အစီရင်ခံစာ လိုအပ်တဲ့အခါ သုံး။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင်၊ ဒီဇိုင်းထုတ်ပေးတဲ့ ကိရိယာက မင်းမရှိတဲ့ ကွန်ပိုနင့်တွေနဲ့ အပေါက်တွေကို ဖုံးဖိပစ်လိုက်လိမ့်မယ်။ design-sync က ဘာမှ မတီထွင်ဘူး။ မှတ်ထားတဲ့ node တွေက တကယ့် ကွန်ပိုနင့်တွေ ဖြစ်လာမယ်၊ မမှတ်ထားတာတွေကိုတော့ မင်း ဆုံးဖြတ်ရမယ့် ထင်ရှားတဲ့ GAP အမှတ်အသားတွေ ဖြစ်လာမယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"design-sync agent ကို သုံးပြီး ဒီ Figma frame ကို ကုတ်ထဲကို ၁:၁ ပုံတူကူးပေးပါ၊ မမှတ်ထားတာတွေကို GAP အဖြစ် အမှတ်အသားလုပ်ပေးပါ\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- မှန်းဆတာလုံးဝမရှိတဲ့ ၁:၁ ပုံတူ — ကူးတာပဲ ကူးတယ်၊ ဘယ်တော့မှ မမှန်းဆဘူး\n- မမှတ်ထားတာတွေအတွက် ရိုးသားတဲ့ GAP အမှတ်အသားတွေ\n- Figma နဲ့ ကိုက်ညီသင့်တဲ့ ကုတ်ကြား ကွာခြားချက် အစီရင်ခံစာ (--mode diff)\n\n👉 ဒါက Agent Harry ထဲက design-sync agent ပဲ။ တပ်ဆင်ပြီး သုံးလိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #DesignToCode #Playwright","ax":1.05,"ay":-0.18},{"id":"usability-tester","kind":"agent","phase":"deliver","model":"sonnet","name":"usability-tester","tagline":"Tests designed to falsify, not flatter.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#5c3a1a\"><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"9\" height=\"1\"/><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/></g>\n  <rect x=\"4\" y=\"3\" width=\"1\" height=\"1\" fill=\"#5c3a1a\"/>\n  <rect x=\"10\" y=\"3\" width=\"1\" height=\"1\" fill=\"#5c3a1a\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"9\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"9\" width=\"1\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"2\" height=\"1\"/><rect x=\"8\" y=\"10\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"3\" y=\"8\" width=\"2\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"2\" height=\"1\"/><rect x=\"3\" y=\"7\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"7\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#67e8f9\"><rect x=\"5\" y=\"9\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"9\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"10\" width=\"1\" height=\"1\" fill=\"#1d1d1f\"/>\n  <g fill=\"#ffffff\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#16a34a\"><rect x=\"6\" y=\"11\" width=\"3\" height=\"1\"/><rect x=\"9\" y=\"13\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n</svg>\n","en":"Most usability tests are rigged to confirm what you already believe — which is exactly why the launch still surprises you. 🔬\n\n✦ What it is\nusability-tester validates a design with users end to end — test plans, task scripts, finding synthesis, and severity scoring — with a skeptical scientist's bias toward falsifying, not flattering.\n\n✦ When to use it\nYou need to validate a flow with real testing rigor. Or you want Mode C: an automated browser-driven pass where Claude itself plays the user against a goal.\n\n✦ Why use it\nWithout it, you get a feel-good score that hides the truth. In Mode C, Claude drives a real browser (via Playwright MCP) as a synthetic user, logs what it actually did, and reports observed metrics — never invented satisfaction numbers.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the usability-tester agent in Mode C to drive the prototype toward this goal along the golden path as this persona, within 12 steps.\"\n\n✦ Benefits\n- Tests designed to falsify, not confirm\n- Severity-scored findings, plus moderated/unmoderated setup and recruiting criteria\n- Mode C: a logged, real browser run with observed (not faked) metrics\n\n👉 That's the usability-tester agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #UsabilityTesting #Playwright #UXResearch\n","my":"","ax":1.05,"ay":-0.18},{"id":"accessibility-auditor","kind":"agent","phase":"deliver","model":"sonnet","name":"accessibility-auditor","tagline":"Measures a11y with axe-core. Never guesses.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#0a6e5e\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"5\" width=\"1\" height=\"1\"/><rect x=\"3\" y=\"6\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"6\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"7\" y=\"8\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#ffffff\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#0c8c7a\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"13\" width=\"5\" height=\"1\" fill=\"#0a6e5e\"/>\n  <g fill=\"#ffffff\"><rect x=\"6\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"8\" y=\"12\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"12\" width=\"1\" height=\"1\" fill=\"#22c55e\"/>\n</svg>\n","en":"An accessibility \"opinion\" feels responsible right up until the lawsuit, the complaint, or the user who simply can't get in. ♿\n\n✦ What it is\naccessibility-auditor audits a built prototype or live URL for WCAG 2.2 AA conformance by driving a real browser and running axe-core in-page — it measures, it does not guess.\n\n✦ When to use it\nA prototype or live URL needs a WCAG 2.2 AA audit grounded in real measurement. Or you only have an existing report or static markup/CSS to re-audit (Mode B).\n\n✦ Why use it\nWithout it, accessibility is someone's best guess until it fails in production. An axe-core reading beats an opinion every time: deterministic findings across contrast, alt text, form labels, ARIA correctness, heading order, and keyboard reachability.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the accessibility-auditor agent to run axe-core against the prototype and report WCAG 2.2 AA findings.\"\n\n✦ Benefits\n- Real browser run with axe-core in-page — deterministic, measured findings\n- Full WCAG 2.2 AA coverage: contrast, alt text, labels, ARIA, headings, keyboard\n- Mode B re-audits an existing report or static markup/CSS when there's no live page\n\n👉 That's the accessibility-auditor agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Accessibility #WCAG #axecore\n","my":"ဒ့ါ အနိမ့်ဆုံး အမြင်တောင်မှ တရားစွဲခံရတဲ့အထိ၊ တိုင်ကြားခံရတဲ့အထိ၊ ဒါမှမဟုတ် အသုံးပြုသူ မဝင်နိုင်တဲ့အထိ တာဝန်ခံသလို ခံစားရတာပဲ။ ♿\n\n✦ ဒါက ဘာလဲ\naccessibility-auditor က အဆင်သင့်ဖြစ်နေတဲ့ prototype ဒါမှမဟုတ် live URL ကို WCAG 2.2 AA နဲ့ ကိုက်ညီမှုရှိမရှိ စစ်ဆေးပေးတယ်၊ တကယ့် browser ကို အသုံးပြုပြီး page ထဲမှာပဲ axe-core ကို run ပြီး စစ်ဆေးတာပါ — ဒါဟာ တိုင်းတာတာပါ၊ မှန်းဆတာ မဟုတ်ဘူးနော်။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nprototype ဒါမှမဟုတ် live URL ကို တကယ့်တိုင်းတာမှုအပေါ် အခြေခံပြီး WCAG 2.2 AA audit လုပ်ဖို့လိုရင် သုံးပါ။ ဒါမှမဟုတ် ရှိပြီးသား report ဒါမှမဟုတ် static markup/CSS ကို ပြန် audit လုပ်ဖို့လိုရင်လည်း သုံးလို့ရတယ် (Mode B)။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင်တော့ accessibility က ထုတ်လုပ်ရေးမှာ ပျက်ကွက်တဲ့အထိ ကောင်းတယ်လို့ ထင်နေတာပဲ။ opinion ထက် axe-core ကို run ပြီး ရတဲ့ findings က အမြဲတမ်း ပိုကောင်းတာပေါ့။ contrast, alt text, form labels, ARIA မှန်ကန်မှု၊ heading order နဲ့ keyboard reachability တွေကို တသမတ်တည်း ရှာဖွေပေးတယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"accessibility-auditor agent ကို သုံးပြီး prototype ကို axe-core နဲ့ run ပေးပြီး WCAG 2.2 AA findings တွေကို report လုပ်ပေးပါ\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- တကယ့် browser နဲ့ page ထဲမှာ axe-core ကို run ပြီး တိုင်းတာထားတဲ့ findings တွေရမယ် — တသမတ်တည်းရှိတယ်။\n- WCAG 2.2 AA အကုန်လုံးကို အကျုံးဝင်တယ်: contrast, alt text, labels, ARIA, headings, keyboard.\n- Mode B က live page မရှိတဲ့အခါ ရှိပြီးသား report ဒါမှမဟုတ် static markup/CSS ကို ပြန် audit လုပ်ပေးတယ်။\n\n👉 ဒါက Agent Harry မှာရှိတဲ့ accessibility-auditor agent ပဲ။ install လုပ်ပြီး run လိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Accessibility #WCAG #axecore","ax":1.05,"ay":-0.18},{"id":"handoff-engineer","kind":"agent","phase":"deliver","model":"sonnet","name":"handoff-engineer","tagline":"Everything dev actually needs.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#ffd54f\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"9\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"3\" width=\"1\" height=\"1\" fill=\"#facc15\"/>\n  <rect x=\"6\" y=\"4\" width=\"3\" height=\"1\" fill=\"#facc15\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#525252\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#facc15\"><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"13\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"13\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"Every \"quick question from dev\" during build is a hole in your handoff doc — and you're answering it at 6pm. 📐\n\n✦ What it is\nhandoff-engineer prepares your designs for engineering: it writes the spec a developer can build from cold, with no back-and-forth. A designer who codes and knows what dev actually needs.\n\n✦ When to use it\nYou're about to hand designs to engineering and need a buildable spec. Or you want edge cases enumerated and accessibility annotated before tickets get cut.\n\n✦ Why use it\nWithout it, the gaps between happy-path frames become build time, bugs, and 6pm questions. It documents design tokens, defines component contracts, enumerates edge cases, and annotates accessibility — answering the questions before they're asked.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the handoff-engineer agent to write the dev handoff doc: spec, tokens, component contracts, edge cases, and a11y annotations.\"\n\n✦ Benefits\n- A spec engineers can build from without a back-and-forth\n- Design tokens documented and component contracts made explicit\n- Edge cases enumerated and accessibility decisions that survive into code\n\n👉 That's the handoff-engineer agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #DesignHandoff #DesignTokens #DesignSystems\n","my":"ဒီလို \"အမြန်မေးခွန်းတွေ\" က Developer ဆီကနေ ပေါ်လာတိုင်း မင်းရဲ့ handoff doc မှာ အပေါက်ကြီးတွေ ပွင့်နေတာပဲ။ ပြီးတော့ ည၆နာရီမှ ပြန်ဖြေနေရတယ်ပေါ့။ 📐\n\n✦ ဒါက ဘာလဲ\nhandoff-engineer က မင်းရဲ့ ဒီဇိုင်းတွေကို developer တွေ တည်ဆောက်လို့ရအောင် ပြင်ဆင်ပေးတာ။ ဘာမှ ပြန်မေးစရာမလိုဘဲ တည်ဆောက်လို့ရတဲ့ spec ကို ရေးပေးတယ်လေ။ developer တွေ တကယ်ဘာလိုလဲဆိုတာကို သိတဲ့၊ ကိုယ်တိုင် code ရေးတတ်တဲ့ designer တစ်ယောက်ပေါ့။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nမင်း ဒီဇိုင်းတွေကို engineering ဆီကို လွှဲပြောင်းတော့မယ်၊ တည်ဆောက်လို့ရတဲ့ spec လိုအပ်နေပြီဆိုရင် သုံးရမှာ။ ဒါမှမဟုတ် ticket တွေ မလုပ်ခင်မှာပဲ edge case တွေကို ဖော်ပြပြီး accessibility ကိုလည်း အမှတ်အသားလုပ်ထားချင်တယ်ဆိုရင်ပေါ့။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမျိုးမရှိဘူးဆိုရင်လေ၊ ပုံမှန် case တွေနဲ့ ကြားထဲက အကွက်တွေက တည်ဆောက်ချိန်၊ bug တွေ၊ ပြီးတော့ ည၆နာရီမှ ပေါ်လာတဲ့ မေးခွန်းတွေ ဖြစ်ကုန်မှာပေါ့။ design token တွေကို document လုပ်ပေးတယ်၊ component contract တွေကို သတ်မှတ်ပေးတယ်၊ edge case တွေကို ဖော်ပြတယ်၊ accessibility ကိုလည်း အမှတ်အသားလုပ်ပေးတယ် — မေးခွန်းတွေ မပေါ်ခင်ကတည်းက ဖြေပေးထားတာလေ။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"handoff-engineer agent ကို သုံးပြီး dev handoff doc ကို ရေးခိုင်း။ spec, tokens, component contracts, edge cases, နဲ့ a11y annotations တွေ အကုန်ပါအောင် ရေးခိုင်း။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- Developer တွေ ပြန်မေးစရာမလိုဘဲ တည်ဆောက်လို့ရတဲ့ spec ရမယ်။\n- Design tokens တွေ document လုပ်ပြီးသား၊ component contract တွေလည်း ပေါ်ပေါ်လွင်လွင် သိသာနေမယ်။\n- Edge case တွေ အကုန်ဖော်ပြထားပြီး accessibility ကလည်း code ထဲအထိ ပါသွားမှာ။\n\n👉 ဒါက Agent Harry ထဲက handoff-engineer agent လေးပဲ။ install လုပ်ပြီး run လိုက်တော့နော်။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #DesignHandoff #DesignTokens #DesignSystems","ax":1.05,"ay":-0.18},{"id":"pm-launch-architect","kind":"agent","phase":"deliver","model":"sonnet","name":"pm-launch-architect","tagline":"From 'designed' to 'in market and growing'.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <rect x=\"7\" y=\"0\" width=\"1\" height=\"2\" fill=\"#d1d5db\"/>\n  <rect x=\"7\" y=\"0\" width=\"1\" height=\"1\" fill=\"#dc2626\"/>\n  <g fill=\"#c2410c\"><rect x=\"4\" y=\"2\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"3\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"1\" height=\"3\"/><rect x=\"11\" y=\"4\" width=\"1\" height=\"3\"/><rect x=\"3\" y=\"7\" width=\"9\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"4\" width=\"7\" height=\"3\"/></g>\n  <g fill=\"#67e8f9\"><rect x=\"5\" y=\"4\" width=\"2\" height=\"1\"/><rect x=\"5\" y=\"5\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"8\" width=\"5\" height=\"1\" fill=\"#ea580c\"/>\n  <g fill=\"#c2410c\"><rect x=\"2\" y=\"9\" width=\"11\" height=\"1\"/><rect x=\"3\" y=\"10\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"11\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"12\" width=\"5\" height=\"1\" fill=\"#1d1d1f\"/>\n  <rect x=\"5\" y=\"12\" width=\"1\" height=\"1\" fill=\"#dc2626\"/>\n  <rect x=\"7\" y=\"12\" width=\"1\" height=\"1\" fill=\"#facc15\"/>\n  <rect x=\"9\" y=\"12\" width=\"1\" height=\"1\" fill=\"#16a34a\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n</svg>\n","en":"\"Designed and ready\" is where most products quietly stall — built, beautiful, and in front of no one. 🚀\n\n✦ What it is\npm-launch-architect takes something from \"designed and ready\" to \"in market and growing.\" A pragmatic GTM lead that names the beachhead instead of the dream.\n\n✦ When to use it\nThe product is designed and the question becomes \"how do we actually get this to market?\" Or you need to pick a first segment instead of launching to everyone at once.\n\n✦ Why use it\nWithout it, you launch to \"everyone\" and burn cash. It picks the beachhead segment and ICP, chooses the right sales/marketing motions, writes battlecards, designs growth loops, and runs a pre-mortem so you see how it fails before it does.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the pm-launch-architect agent to pick our beachhead segment, define the ICP, and sequence the launch.\"\n\n✦ Benefits\n- A named beachhead segment and a defined ICP, not a dream audience\n- GTM motions, battlecards, and growth loops that compound rather than leak\n- A pre-mortem and a sane launch sequence — without setting cash on fire\n\n👉 That's the pm-launch-architect agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #GTM #ProductLaunch #ICP\n","my":"","ax":1.05,"ay":-0.18},{"id":"critique-partner","kind":"agent","phase":"cross-cutting","model":"opus","name":"critique-partner","tagline":"Stress-tests any agent's output.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#7a1c14\"><rect x=\"4\" y=\"2\" width=\"1\" height=\"2\"/><rect x=\"5\" y=\"4\" width=\"1\" height=\"1\"/><rect x=\"10\" y=\"2\" width=\"1\" height=\"2\"/><rect x=\"9\" y=\"4\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#7a1c14\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#7a1c14\"><rect x=\"4\" y=\"7\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"7\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#dc2626\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"2\" height=\"1\"/><rect x=\"8\" y=\"9\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#7a1c14\"><rect x=\"2\" y=\"11\" width=\"11\" height=\"1\"/></g>\n  <g fill=\"#dc2626\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"The deliverable that \"feels done\" is exactly the one nobody pressure-tested. That's where projects quietly break. 🧨\n\n✦ What it is\ncritique-partner is Agent Harry's built-in devil's advocate. Hand it any artifact and it stress-tests it for weak logic, lazy assumptions, and comfortable consensus — direct, respectful, run between phases.\n\n✦ When to use it\nYou want to stress-test an agent's output before it moves to the next phase. Or something feels \"too clean\" and you can't say why — that instinct is worth running down.\n\n✦ Why use it\nWithout it, the unbacked claim, the hidden trade-off, and the option no one considered ship straight to the stakeholder. It hunts those down — and carries an IA lens (v5.2) so it can critique structure, naming, and grouping too.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the critique-partner agent to stress-test this positioning draft before we lock it.\"\n\n✦ Benefits\n- The honest critique teammates were too polite to give\n- Works across the whole pipeline — research, positioning, prioritization, design, test plans\n- Autonomous authority: it doesn't soften its read to keep the peace\n\n👉 That's the critique-partner agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #DesignCritique #ProductStrategy #DevilsAdvocate\n","my":"\"ပြီးပြီ\" လို့ ထင်ရတဲ့ အလုပ်က တကယ်တော့ ဘယ်သူမှ သေချာ စစ်မထားတဲ့ အလုပ်ပဲ။ အဲ့ဒါမှ ပရောဂျက်တွေ တိတ်တိတ်လေး ပျက်ကုန်တာ။ 🧨\n\n✦ ဒါက ဘာလဲ\ncritique-partner ဆိုတာ Agent Harry ထဲမှာ ပါတဲ့ ရှောင်တခင် မေးခွန်းထုတ်တဲ့ အကူပါ။ ဘယ်အရာကိုမဆို ပေးလိုက်ရင် ယုတ်မာတဲ့ အကြောင်းပြချက်၊ ပေါ့ဆတဲ့ ယူဆချက်တွေ၊ သက်သောင့်သက်သာ လက်ခံထားတဲ့ အချက်တွေ ရှိမရှိ စစ်ဆေးပေးတယ် — တိုက်ရိုက်၊ လေးစားမှု ရှိရှိ၊ အဆင့်တွေကြားထဲမှာ အမြဲတမ်း လုပ်ပေးတယ်လေ။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nနောက်အဆင့်ကို မသွားခင် အကူရဲ့ အလုပ်ကို စစ်ဆေးချင်တဲ့အခါ။ ဒါမှမဟုတ် တစ်ခုခုက \"အရမ်း ပြေပြစ်နေတယ်\" လို့ ခံစားရပြီး ဘာကြောင့်လဲ ဆိုတာ မပြောတတ်တဲ့အခါ — အဲ့ဒီ အတွင်းစိတ်အသိကို လိုက်ရှာသင့်တယ်နော်။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမပါရင် မခိုင်လုံတဲ့ အငြင်း၊ ဖုံးကွယ်ထားတဲ့ လဲလှယ်မှု၊ ဘယ်သူမှ မစဉ်းစားဖူးတဲ့ အခွင့်အလမ်းတွေ ဟုတ်ဟုတ်ထိထိ ပိုင်ရှင်ဆီ ရောက်သွားမှာပေါ့။ ဒါတွေက အဲ့ဒါတွေကို လိုက်ရှာပေးတယ် — နောက်ပြီး IA ကိုလည်း ထည့်သွင်းထားတယ် (v5.2) ဆိုတော့ ဖွဲ့စည်းပုံ၊ အမည်ပေးခြင်း၊ အုပ်စုခွဲခြင်းတွေကိုလည်း ဝေဖန်ပေးနိုင်တယ်လေ။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"ဒီ positioning ကို lock မချခင် critique-partner agent နဲ့ စစ်ဆေးပေးပါ့လား။\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- သူငယ်ချင်းတွေက ခင်လို့ မပြောရဲတဲ့ ရိုးသားတဲ့ ဝေဖန်ချက်\n- အလုပ်လုပ်ငန်းစဉ် တစ်ခုလုံးမှာ အလုပ်လုပ်တယ် — သုတေသန၊ positioning၊ ဦးစားပေးမှု၊ ဒီဇိုင်း၊ စမ်းသပ်မှု အစီအစဉ်တွေ\n- ကိုယ်ပိုင် အာဏာစက် – ငြိမ်းချမ်းရေး ထိန်းသိမ်းဖို့ အမြင်ကို ပြေလျော့အောင် မလုပ်ဘူး\n\n👉 ဒါက Agent Harry ထဲက critique-partner agent ပဲ။ ထည့်သွင်းပြီး သုံးကြည့်လိုက်။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #DesignCritique #ProductStrategy #DevilsAdvocate\n","ax":0,"ay":0.92},{"id":"pm-metrics-architect","kind":"agent","phase":"cross-cutting","model":"sonnet","name":"pm-metrics-architect","tagline":"One number to chase, three to watch, one to fear.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#3f3520\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"5\" width=\"7\" height=\"1\"/></g>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"3\" y=\"8\" wi
