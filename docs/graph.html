dth=\"2\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"2\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"8\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#a5f3fc\"/>\n  <g fill=\"#1d1d1f\"><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#65a30d\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n</svg>\n","en":"\"We don't actually know if this is working\" is the most expensive sentence in product. 📊\n\n✦ What it is\npm-metrics-architect designs how a product or feature gets measured — north-star refinement, full dashboards, OKR planning, and tracking plans. A skeptical instrumentation lead.\n\n✦ When to use it\nA feature is being scoped and you need to decide how its success gets measured. Or existing instrumentation is producing numbers nobody trusts.\n\n✦ Why use it\nWithout it, you build blind and the dashboard lies. Its mantra — one number to chase, three to watch, one to fear — pairs the north-star with input, health, and counter-metrics, then makes them real with events, properties, and instrumentation.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the pm-metrics-architect agent to design a north-star, dashboard, and tracking plan for our new activation flow.\"\n\n✦ Benefits\n- A refined north-star plus input, health, and counter-metrics\n- OKRs that turn the metric picture into measurable key results\n- The gate-clearer for the Success-Metrics Gate before Define crosses into Deliver\n\n👉 That's the pm-metrics-architect agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #ProductMetrics #NorthStar #OKRs\n","my":"","ax":0,"ay":0.92},{"id":"brand-decoder","kind":"agent","phase":"cross-cutting","model":"sonnet","name":"brand-decoder","tagline":"Decodes how a brand actually thinks.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <!-- flat cap -->\n  <g fill=\"#7c2d12\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/></g>\n  <rect x=\"4\" y=\"5\" width=\"8\" height=\"1\" fill=\"#9a3412\"/>\n  <rect x=\"11\" y=\"5\" width=\"1\" height=\"1\" fill=\"#7c2d12\"/>\n  <!-- face skin -->\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"2\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <!-- left eye + smile + boots -->\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <!-- monocle ring over right eye -->\n  <g fill=\"#1d1d1f\"><rect x=\"8\" y=\"7\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"9\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"11\" y=\"8\" width=\"1\" height=\"1\"/></g>\n  <!-- lens glint -->\n  <rect x=\"9\" y=\"8\" width=\"2\" height=\"1\" fill=\"#fcd34d\"/>\n  <!-- body (amber) -->\n  <g fill=\"#b45309\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <!-- gold scarf accent -->\n  <g fill=\"#fcd34d\"><rect x=\"5\" y=\"12\" width=\"5\" height=\"1\"/></g>\n</svg>\n","en":"Most \"off-brand\" work isn't ugly — it just misread how the brand thinks about itself. By then it's already in review. 🧬\n\n✦ What it is\nbrand-decoder reads how a company already thinks about itself instead of stamping a generic framework on top. A brand interpreter, not a brand imposer.\n\n✦ When to use it\nYou're doing client work or a design test inside a brand you don't own. Or the product is established and you must design within its existing identity.\n\n✦ Why use it\nWithout it, downstream positioning, IA, and visual work build on a guess and read as \"not us.\" It decodes the brand's concept, worldview, mental model, vocabulary, and on/off-brand tells into brand-concept.md before a single screen is drawn.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the brand-decoder agent to decode this product's brand into a brand-concept.md before we start positioning.\"\n\n✦ Benefits\n- Surfaces the mental model the brand never wrote down\n- Captures the vocabulary it uses — and the words it avoids\n- A reusable brand-concept.md every later phase reads, so work lands native from the first pass\n\n👉 That's the brand-decoder agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #BrandStrategy #BrandDesign #ClientWork\n","my":"တံဆိပ်နဲ့ မကိုက်ညီတဲ့ အလုပ်တော်တော်များများက မလှတာ မဟုတ်ပါဘူး။ သူတို့ကိုယ်သူတို့ ဘယ်လို မြင်တယ်ဆိုတာကိုပဲ မှားပြီး နားလည်လိုက်တာပါ။ အဲ့ဒီအချိန်ကျရင်တော့ ပြန်သုံးသပ်ဖို့တောင် နောက်ကျသွားပါပြီ။ 🧬\n\n✦ ဒါက ဘာလဲ\nbrand-decoder က generic framework ကို အပေါ်ကနေ ပုံခင်းမယ့်အစား၊ ကုမ္ပဏီတစ်ခုက ကိုယ့်ကိုယ်ကို ဘယ်လို မြင်လဲ ဆိုတာကို ဖတ်ပေးတယ်။ Brand ကို အတင်းထည့်တာ မဟုတ်ဘူး၊ Brand ကို နားလည်ပေးတာ။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nကိုယ့်ပိုင်မဟုတ်တဲ့ Brand တစ်ခုခုနဲ့ Client အလုပ်လုပ်နေရင်၊ ဒါမှမဟုတ် Design Test လုပ်နေရင် သုံးပါ။ ဒါမှမဟုတ် Product က တည်ပြီးသား၊ ရှိပြီးသား Identity ထဲမှာပဲ Design လုပ်ရတော့မယ်ဆိုရင်ပေါ့။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမပါရင် Position, IA, Visual အလုပ်တွေက ခန့်မှန်းချက်ပေါ် အခြေခံပြီး \"ငါတို့နဲ့ မဆိုင်ဘူး\" လို့ ထင်စေမှာပေါ့။ Design မဆွဲခင်မှာပဲ Brand ရဲ့ Concept, Worldview, Mental Model, Vocabulary, On/Off-brand tells တွေကို brand-concept.md ထဲကို Decode လုပ်ပေးတယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"Positioning မစခင်မှာ ဒီ product ရဲ့ brand ကို brand-concept.md အဖြစ် decode လုပ်ဖို့ brand-decoder agent ကို သုံးပေးပါ\" လို့။\n\n✦ ဘာတွေ ကောင်းလဲ\n- Brand က ဘယ်တော့မှ မရေးခဲ့တဲ့ Mental Model ကို ဖော်ထုတ်ပေးတယ်\n- သူသုံးတဲ့ Vocabulary တွေကို သိမ်းဆည်းတယ် — ဘာစကားလုံးတွေ ရှောင်လဲ ဆိုတာပါ သိရတယ်။\n- နောက်ပိုင်း အဆင့်တွေ အကုန်လုံး ဖတ်လို့ရမယ့် Reusable brand-concept.md တစ်ခု ရလာတယ်၊ အဲ့ဒါဆို အစကတည်းက Native အတိုင်း ဖြစ်မှာပေါ့။\n\n👉 ဒါက Agent Harry ထဲက brand-decoder agent ပဲ။ Install လုပ်ပြီး Run လိုက်။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #BrandStrategy #BrandDesign #ClientWork","ax":0,"ay":0.92},{"id":"product-fingerprint-curator","kind":"agent","phase":"cross-cutting","model":"sonnet","name":"product-fingerprint-curator","tagline":"Captures the product's real visual language.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#7c3aed\"><rect x=\"4\" y=\"3\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"4\" width=\"9\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"10\" y=\"5\" width=\"1\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"2\" width=\"1\" height=\"1\" fill=\"#a78bfa\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"5\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"6\" width=\"6\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#ffffff\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <rect x=\"5\" y=\"12\" width=\"1\" height=\"1\" fill=\"#dc2626\"/>\n  <rect x=\"7\" y=\"12\" width=\"1\" height=\"1\" fill=\"#facc15\"/>\n  <rect x=\"9\" y=\"12\" width=\"1\" height=\"1\" fill=\"#16a34a\"/>\n  <rect x=\"6\" y=\"13\" width=\"1\" height=\"1\" fill=\"#06b6d4\"/>\n  <rect x=\"8\" y=\"13\" width=\"1\" height=\"1\" fill=\"#7c3aed\"/>\n</svg>\n","en":"New feature work that feels \"bolted on\" isn't a talent problem — it's a missing fingerprint. 🎨\n\n✦ What it is\nproduct-fingerprint-curator captures a product's actual visual language so new feature work matches it instead of feeling bolted on. A pattern-extractor with a real point of view.\n\n✦ When to use it\nNo product-fingerprint.md exists at the project root yet. Or the Define→Deliver boundary fires and there's no fingerprint to hand downstream agents.\n\n✦ Why use it\nWithout it, every new screen guesses at the look and drifts. From 3–7 designer-picked Figma references — not the averaged internet — it synthesizes the signals, composition patterns, and mandatory anti-patterns that define how the product should feel.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the product-fingerprint-curator agent to build a product-fingerprint.md from these 5 Figma references.\"\n\n✦ Benefits\n- A fingerprint built from references you actually find exciting\n- Visual signals, composition patterns, and explicit anti-patterns in one place\n- Read by lo-fi-designer, figma-designer, and design-engineer at intake — so every feature feels native\n\n👉 That's the product-fingerprint-curator agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #DesignSystems #VisualLanguage #Figma\n","my":"","ax":0,"ay":0.92},{"id":"figma-component-bootstrapper","kind":"agent","phase":"cross-cutting","model":"sonnet","name":"figma-component-bootstrapper","tagline":"Gives every project a real component library.","mascot":"<svg viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">\n  <g fill=\"#6366f1\"><rect x=\"5\" y=\"3\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"4\" width=\"7\" height=\"1\"/><rect x=\"3\" y=\"5\" width=\"9\" height=\"1\"/></g>\n  <rect x=\"7\" y=\"2\" width=\"1\" height=\"1\" fill=\"#a5b4fc\"/>\n  <g fill=\"#f5cba7\"><rect x=\"5\" y=\"6\" width=\"5\" height=\"1\"/><rect x=\"4\" y=\"7\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"8\" width=\"3\" height=\"1\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"4\" y=\"9\" width=\"7\" height=\"1\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/></g>\n  <g fill=\"#1d1d1f\"><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"10\" width=\"3\" height=\"1\"/><rect x=\"4\" y=\"15\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"15\" width=\"2\" height=\"1\"/></g>\n  <g fill=\"#6366f1\"><rect x=\"3\" y=\"11\" width=\"9\" height=\"1\"/><rect x=\"4\" y=\"12\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"1\"/><rect x=\"4\" y=\"14\" width=\"3\" height=\"1\"/><rect x=\"8\" y=\"14\" width=\"3\" height=\"1\"/></g>\n  <g fill=\"#a5b4fc\"><rect x=\"5\" y=\"12\" width=\"2\" height=\"2\"/><rect x=\"8\" y=\"12\" width=\"2\" height=\"2\"/></g>\n  <g fill=\"#e0e7ff\"><rect x=\"5\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"8\" y=\"12\" width=\"1\" height=\"1\"/></g>\n</svg>\n","en":"No component library means your \"design\" is a pile of loose frames and groups — and every future screen pays the tax. 🧱\n\n✦ What it is\nfigma-component-bootstrapper gives a project a real, instanceable Figma component library when it doesn't have one yet — without you hand-building a single button.\n\n✦ When to use it\nThe project has no published Figma component library. Or figma-designer keeps falling back to frames and groups because it has nothing to instance.\n\n✦ Why use it\nWithout it, future design work is built from disposable frames instead of reusable components. It builds ~25 baseline components — buttons, inputs, containers, feedback, navigation — plus the feature-specific ones the current lo-fi handoff names.\n\n✦ How to use it\nJust tell Agent Harry:\n\"Use the figma-component-bootstrapper agent to create a baseline Figma component library for this project from our product-fingerprint.\"\n\n✦ Benefits\n- ~25 real, instanceable components already speaking your visual language\n- Sources signals from product-fingerprint.md and enriches with code tokens (Tailwind / CSS / JSON)\n- Auto-detects create vs extend, and writes a manifest figma-designer reads on every feature\n\n👉 That's the figma-component-bootstrapper agent in Agent Harry. Install it and run it.\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #DesignSystems #ComponentLibrary\n","my":"ဖရိမ်တွေနဲ့ ဂရုတွေပဲ ပြန့်ကျဲနေတဲ့ ဒီဇိုင်းဆိုတာ... အနာဂတ်မှာ လုပ်သမျှ စခရင်တိုင်းအတွက် အပိုအလုပ်တွေ ပိုများတာပဲ။ 🧱\n\n✦ ဒါက ဘာလဲ\nfigma-component-bootstrapper က ပရောဂျက်တစ်ခုမှာ အရင်က component library မရှိရင်တောင်မှ တကယ်သုံးလို့ရတဲ့ Figma component library တစ်ခုကို ဖန်တီးပေးတယ်၊ ဘာ button မှ ကိုယ်တိုင်မလုပ်ရဘူး။\n\n✦ ဘယ်အချိန် သုံးရမလဲ\nပရောဂျက်မှာ ထုတ်ဝေထားတဲ့ Figma component library မရှိဘူး။ ဒါမှမဟုတ် figma-designer က သုံးစရာ component မရှိလို့ frames နဲ့ groups တွေပဲ ပြန်ပြန်သုံးနေရတယ်။\n\n✦ ဘာလို့ သုံးသင့်တာလဲ\nဒါမရှိရင်၊ အနာဂတ် ဒီဇိုင်းအလုပ်တွေဟာ ပြန်သုံးလို့မရတဲ့ frames တွေနဲ့ပဲ တည်ဆောက်ရလိမ့်မယ်။ ဒါက ~၂၅ ခုလောက်ရှိတဲ့ အခြေခံ components တွေ (buttons, inputs, containers, feedback, navigation) နဲ့ လက်ရှိ lo-fi handoff မှာ နာမည်ပေးထားတဲ့ feature-specific components တွေကိုပါ ဖန်တီးပေးတယ်။\n\n✦ ဘယ်လို သုံးရမလဲ\nAgent Harry ကို ဒီလိုပဲ ပြောလိုက်ရုံ —\n\"Use the figma-component-bootstrapper agent to create a baseline Figma component library for this project from our product-fingerprint.\"\n\n✦ ဘာတွေ ကောင်းလဲ\n- မင်းရဲ့ visual language ကိုပြောနေတဲ့ တကယ်သုံးလို့ရတဲ့ components ~၂၅ ခု ရှိပြီးသား\n- product-fingerprint.md ကနေ signal တွေကို ယူပြီး code tokens (Tailwind / CSS / JSON) နဲ့ ပိုကောင်းအောင် လုပ်ပေးတယ်\n- create လုပ်တာလား extend လုပ်တာလား ကိုယ်တိုင်သိပြီး manifest တစ်ခု ရေးပေးတယ်၊ အဲ့ဒါကို figma-designer က feature တိုင်းမှာ ဖတ်တယ်\n\n👉 ဒါက Agent Harry ထဲက figma-component-bootstrapper agent ပဲ။ ထည့်သွင်းပြီး သုံးလိုက်တော့။\n\n#AgentHarry #ClaudeCode #ProductDesign #UX #Figma #DesignSystems #ComponentLibrary","ax":0,"ay":0.92},{"id":"hub:discovery","kind":"hub","phase":"discovery","name":"Discovery","sub":"Understand the problem","ax":-1.05,"ay":-0.18},{"id":"hub:define","kind":"hub","phase":"define","name":"Define","sub":"Decide what to build","ax":0,"ay":-0.95},{"id":"hub:deliver","kind":"hub","phase":"deliver","name":"Deliver","sub":"Make it real","ax":1.05,"ay":-0.18},{"id":"hub:cross-cutting","kind":"hub","phase":"cross-cutting","name":"Cross-cutting","sub":"Run any time","ax":0,"ay":0.92}],"edges":[["hub:discovery","discovery-researcher"],["hub:discovery","competitive-analyst"],["hub:define","pm-strategist"],["hub:define","product-positioner"],["hub:define","feature-prioritizer"],["hub:define","ideation-facilitator"],["hub:define","prd-author"],["hub:define","information-architect"],["hub:define","lo-fi-designer"],["hub:deliver","figma-designer"],["hub:deliver","design-engineer"],["hub:deliver","design-sync"],["hub:deliver","usability-tester"],["hub:deliver","accessibility-auditor"],["hub:deliver","handoff-engineer"],["hub:deliver","pm-launch-architect"],["hub:cross-cutting","critique-partner"],["hub:cross-cutting","pm-metrics-architect"],["hub:cross-cutting","brand-decoder"],["hub:cross-cutting","product-fingerprint-curator"],["hub:cross-cutting","figma-component-bootstrapper"],["orchestrator","hub:discovery"],["orchestrator","hub:define"],["orchestrator","hub:deliver"],["orchestrator","hub:cross-cutting"],["hub:discovery","hub:define"],["hub:define","hub:deliver"],["hub:cross-cutting","hub:discovery"],["hub:cross-cutting","hub:define"],["hub:cross-cutting","hub:deliver"]]};
let LANG = "en";

const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){ W=innerWidth; H=innerHeight; cvs.width=W*DPR; cvs.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

const P = DATA.phases;
const N = DATA.nodes.map(n=>({ ...n, x:(Math.cos(n.id.length)*40)+ n.ax*260, y:(Math.sin(n.id.length)*40)+ n.ay*230, vx:0, vy:0,
  r: n.kind==="hub"?20 : (n.id==="orchestrator"?34:26), img:null }));
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const E = DATA.edges.map(([a,b])=>[byId[a],byId[b]]).filter(e=>e[0]&&e[1]);

let pending = 0;
for (const n of N){ if (n.kind==="agent" && n.mascot){ pending++;
  const img = new Image();
  img.onload = ()=>{ n.img=img; pending--; };
  img.onerror = ()=>{ pending--; };
  img.src = "data:image/svg+xml;utf8,"+encodeURIComponent(n.mascot);
}}

let cam={x:0,y:0,z:1};
function toScreen(p){ return { x: W/2 + (p.x-cam.x)*cam.z, y: H/2 + (p.y-cam.y)*cam.z }; }
function toWorld(sx,sy){ return { x:(sx-W/2)/cam.z+cam.x, y:(sy-H/2)/cam.z+cam.y }; }

const SPREAD=255;
function step(){
  for(let i=0;i<N.length;i++){ const a=N[i];
    a.vx += (a.ax*SPREAD - a.x)*0.006;
    a.vy += (a.ay*SPREAD - a.y)*0.006;
    for(let j=i+1;j<N.length;j++){ const b=N[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
      const rep=(a.r+b.r)*(a.r+b.r)*1.7/d2; const fx=dx/d*rep, fy=dy/d*rep;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  for(const e of E){ const a=e[0],b=e[1];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
    const rest=(a.kind==="hub"||b.kind==="hub")?92:120;
    const f=(d-rest)*0.012; const fx=dx/d*f, fy=dy/d*f;
    if(!a.fixed){a.vx+=fx;a.vy+=fy} if(!b.fixed){b.vx-=fx;b.vy-=fy}
  }
  for(const n of N){ if(n.fixed) continue; n.vx*=0.86; n.vy*=0.86; n.x+=n.vx; n.y+=n.vy; }
}

let hover=null, selected=null;
function neighbors(n){ const s=new Set(); for(const e of E){ if(e[0]===n)s.add(e[1]); if(e[1]===n)s.add(e[0]);} return s; }

function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,"#0e1118"); g.addColorStop(1,"#070809"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const hl = hover||selected; const nb = hl?neighbors(hl):null;
  for(const e of E){ const a=e[0],b=e[1];
    const pa=toScreen(a), pb=toScreen(b);
    const active = hl && (a===hl||b===hl);
    ctx.strokeStyle = active ? (P[a.phase]?(P[a.phase].color):"#888")+"cc" : (hl?"#2a314055":"#2a314099");
    ctx.lineWidth = active?2.2:1; ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  }
  for(const n of N){
    const p=toScreen(n); const col=P[n.phase]?P[n.phase].color:"#888";
    const dim = hl && n!==hl && !(nb&&nb.has(n));
    ctx.globalAlpha = dim?0.32:1;
    const r=n.r*cam.z;
    if(n.kind==="hub"){
      ctx.shadowBlur=24; ctx.shadowColor=col;
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle="#fff"; ctx.font="600 "+(13*cam.z)+"px sans-serif"; ctx.textAlign="center";
      ctx.fillText(n.name, p.x, p.y+r+16*cam.z);
    } else {
      ctx.shadowBlur=22; ctx.shadowColor=col;
      ctx.fillStyle="#0d1017"; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
      ctx.shadowBlur=0;
      ctx.lineWidth=2; ctx.strokeStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke();
      if(n.img){ const s=r*1.7; ctx.imageSmoothingEnabled=false; ctx.drawImage(n.img,p.x-s/2,p.y-s/2,s,s); }
      else { ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,r*0.5,0,7); ctx.fill(); }
      if(!dim){ ctx.fillStyle="#cfd6e2"; ctx.font="500 "+(12.5*cam.z)+"px sans-serif"; ctx.textAlign="center";
        ctx.fillText(n.name, p.x, p.y+r+15*cam.z); }
    }
    ctx.globalAlpha=1;
  }
}
function loop(){ step(); draw(); requestAnimationFrame(loop); } loop();

function pick(sx,sy){ let best=null,bd=1e9; for(const n of N){ const p=toScreen(n); const d=Math.hypot(p.x-sx,p.y-sy); if(d< (n.r*cam.z+8) && d<bd){bd=d;best=n;} } return best; }
let drag=null,dragMoved=false,panning=false,last=null;
cvs.addEventListener("mousemove",e=>{
  if(drag){ const w=toWorld(e.clientX,e.clientY); drag.x=w.x; drag.y=w.y; drag.vx=drag.vy=0; dragMoved=true; return; }
  if(panning){ cam.x-=(e.clientX-last.x)/cam.z; cam.y-=(e.clientY-last.y)/cam.z; last={x:e.clientX,y:e.clientY}; return; }
  hover=pick(e.clientX,e.clientY); cvs.style.cursor=hover?"pointer":"grab";
});
cvs.addEventListener("mousedown",e=>{ const n=pick(e.clientX,e.clientY); if(n){ drag=n; n.fixed=true; dragMoved=false; } else { panning=true; last={x:e.clientX,y:e.clientY}; } });
addEventListener("mouseup",e=>{ if(drag){ drag.fixed=false; if(!dragMoved) openPanel(drag); drag=null; } panning=false; });
cvs.addEventListener("wheel",e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0012); const w=toWorld(e.clientX,e.clientY);
  cam.z=Math.max(0.4,Math.min(2.6,cam.z*f)); const w2=toWorld(e.clientX,e.clientY); cam.x+=w.x-w2.x; cam.y+=w.y-w2.y; },{passive:false});

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function fmt(md){ if(!md) return ""; const out=[]; for(let raw of md.split("\n")){ const l=raw.trim();
  if(!l){continue;}
  if(l.startsWith("✦")) out.push("<h4>"+esc(l.replace(/^✦\s*/,""))+"</h4>");
  else if(l.startsWith("👉")) out.push('<p class="cta">'+inline(esc(l))+"</p>");
  else if(l.startsWith("#")) out.push('<p class="tags">'+esc(l)+"</p>");
  else if(l.startsWith("- ")) out.push("<li>"+inline(esc(l.slice(2)))+"</li>");
  else if((l.startsWith('"')&&l.endsWith('"'))) out.push("<pre>"+esc(l)+"</pre>");
  else out.push("<p>"+inline(esc(l))+"</p>");
 } if(out[0]&&out[0].indexOf("<p>")===0) out[0]=out[0].replace("<p>",'<p class="lead">'); return out.join(""); }

function renderBody(n){
  if(LANG==="my" && !n.my){ document.getElementById("p-body").innerHTML =
    fmt(n.en) + '<div class="pending">မြန်မာ ဘာသာပြန် မကြာခင် ထည့်ပါမယ် — အခု English ပြထားပါတယ်။</div>'; return; }
  const txt = LANG==="my" ? n.my : n.en;
  document.getElementById("p-body").innerHTML = fmt(txt) || '<p class="tags">No content.</p>';
}
function openPanel(n){
  if(n.kind!=="agent"){ selected=n; return; }
  selected=n;
  const ph=P[n.phase];
  document.getElementById("p-mascot").innerHTML = '<div class="mascot" style="background:'+ph.color+'1f">'+n.mascot+"</div>";
  document.getElementById("p-name").textContent=n.name;
  const pe=document.getElementById("p-phase"); pe.textContent=ph.label.toUpperCase();
  pe.style.color="#fff"; pe.style.background="linear-gradient(135deg,"+ph.color+","+ph.c2+")";
  document.getElementById("p-model").textContent="model · "+n.model;
  renderBody(n);
  document.getElementById("panel").classList.add("open");
}
document.getElementById("close").onclick=()=>{ document.getElementById("panel").classList.remove("open"); selected=null; };
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l; document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));
  if(selected&&selected.kind==="agent") renderBody(selected);
});

document.getElementById("legend").innerHTML = Object.keys(P).map(k=>
  '<span><i style="background:'+P[k].color+'"></i>'+P[k].label+"</span>").join("");
</script>
</body>
