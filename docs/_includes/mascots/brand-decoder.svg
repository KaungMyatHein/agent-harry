<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
  <!-- flat cap -->
  <g fill="#7c2d12"><rect x="5" y="3" width="5" height="1"/><rect x="4" y="4" width="7" height="1"/></g>
  <rect x="4" y="5" width="8" height="1" fill="#9a3412"/>
  <rect x="11" y="5" width="1" height="1" fill="#7c2d12"/>
  <!-- face skin -->
  <g fill="#f5cba7"><rect x="5" y="6" width="5" height="1"/><rect x="4" y="7" width="7" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="6" y="8" width="2" height="1"/><rect x="4" y="9" width="7" height="1"/><rect x="5" y="10" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/></g>
  <!-- left eye + smile + boots -->
  <g fill="#1d1d1f"><rect x="5" y="8" width="1" height="1"/><rect x="6" y="10" width="3" height="1"/><rect x="4" y="15" width="2" height="1"/><rect x="9" y="15" width="2" height="1"/></g>
  <!-- monocle ring over right eye -->
  <g fill="#1d1d1f"><rect x="8" y="7" width="3" height="1"/><rect x="8" y="9" width="3" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/></g>
  <!-- lens glint -->
  <rect x="9" y="8" width="2" height="1" fill="#fcd34d"/>
  <!-- body (amber) -->
  <g fill="#b45309"><rect x="3" y="11" width="9" height="1"/><rect x="4" y="12" width="7" height="1"/><rect x="4" y="13" width="7" height="1"/><rect x="4" y="14" width="3" height="1"/><rect x="8" y="14" width="3" height="1"/></g>
  <!-- gold scarf accent -->
  <g fill="#fcd34d"><rect x="5" y="12" width="5" height="1"/></g>
</svg>
