<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
  <!-- hard hat -->
  <g fill="#fbbf24"><rect x="7" y="2" width="2" height="1"/><rect x="5" y="3" width="6" height="1"/><rect x="4" y="4" width="8" height="1"/></g>
  <rect x="3" y="5" width="10" height="1" fill="#d97706"/>
  <!-- face skin -->
  <g fill="#f5cba7"><rect x="5" y="6" width="5" height="1"/><rect x="4" y="7" width="7" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="6" y="8" width="3" height="1"/><rect x="10" y="8" width="1" height="1"/><rect x="4" y="9" width="7" height="1"/><rect x="5" y="10" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/></g>
